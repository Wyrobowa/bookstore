version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    # typescript-eslint does not support TypeScript 7 yet, and a TS 7 bump makes
    # eslint fail at config load, which reds the whole verify job.
    # https://github.com/typescript-eslint/typescript-eslint/issues/10940
    ignore:
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    groups:
      dependencies:
        patterns:
          - '*'

  # Without this, action versions are never bumped automatically — which is how
  # the account drifted onto Node 20 actions unnoticed until days before the
  # runner removal.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      actions:
        patterns:
          - '*'
